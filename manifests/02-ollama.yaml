apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - name: http
          containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests: {cpu: "1", memory: 8Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "2", memory: 12Gi, nvidia.com/gpu: "1"}
      volumes:
      - name: ollama-data
        persistentVolumeClaim: {claimName: ollama-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app: ollama}
  ports:
  - name: http
    port: 11434
    targetPort: http
