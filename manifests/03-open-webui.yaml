apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels: {app: open-webui}
  template:
    metadata:
      labels: {app: open-webui}
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: OLLAMA_BASE_URL
          value: http://ollama:11434
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: open-webui-secret, key: WEBUI_SECRET_KEY}
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
      volumes:
      - name: webui-data
        persistentVolumeClaim: {claimName: webui-data}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector: {app: open-webui}
  ports:
  - name: http
    port: 8080
    targetPort: http
